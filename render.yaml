# Render blueprint - hosted pilot deployment.
#
# Render is used here because this service needs three things a serverless
# platform cannot give it: one long-lived process (in-memory sessions), a
# durable disk with a single writer (the append-only audit chain), and
# unbuffered responses held open for minutes (SSE streaming). See docs/HOSTING.md.
#
# To deploy: New > Blueprint on dashboard.render.com, point it at this repo.
# Render reads this file and asks for the two values marked `sync: false`.
#
# This is a PILOT posture, not the production one. Production is the
# nginx + oauth2-proxy + systemd deployment in docs/HANDOVER.md, on a host the
# bank controls. Read the "Before real customer data" section of docs/HOSTING.md
# before anyone types a customer name into this.

services:
  - type: web
    name: aml-atb
    runtime: node
    plan: starter # the free plan has no persistent disk, so the audit trail would be lost
    region: frankfurt # closest Render region to Baku; see docs/HOSTING.md on data residency
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/index.js
    healthCheckPath: /readyz # returns 503 when the audit trail stops being writable
    numInstances: 1 # the audit chain has exactly one writer - do not scale this out
    autoDeploy: false # a compliance tool should not redeploy itself on every push

    disk:
      name: audit
      mountPath: /var/data
      sizeGB: 1 # ~1 million audit records; monitor and grow before it fills

    envVars:
      - key: NODE_VERSION
        value: "22.14.0"

      # Render routes to the container over its own network, so bind all
      # interfaces. TLS is terminated by Render in front of this.
      - key: BIND_HOST
        value: 0.0.0.0

      # No IdP in front here, so identity is earned with a password rather than
      # asserted in a header. Entries are minted by tools/hash-password.mjs.
      - key: AUTH_MODE
        value: basic

      - key: AUDIT_DIR
        value: /var/data/audit

      # Prompted for at deploy time and never written into the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_USERS
        sync: false
