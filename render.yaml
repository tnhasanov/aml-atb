# Render blueprint - hosted pilot.
#
# To deploy: New > Blueprint on dashboard.render.com, point it at this repo.
# Render reads this file and asks for the two values marked `sync: false`.
#
# ---------------------------------------------------------------------------
# THIS IS A PILOT CONFIGURATION. It keeps no record of questions or answers
# (AUDIT_MODE=off), so it is for SYNTHETIC cases only - invented names, real
# scenarios. That is enough to judge whether the clause citations are right and
# whether the Azerbaijani reads naturally, which is the only thing a pilot is
# for. The UI shows a notice saying so.
#
# Before anyone types a real customer name, switch to the durable configuration
# at the bottom of this file, and read docs/HANDOVER.md.
# ---------------------------------------------------------------------------

services:
  - type: web
    name: aml-atb
    runtime: node
    plan: free # spins down when idle; the first request after that is slow
    region: frankfurt # closest Render region to Baku
    buildCommand: npm ci && npm run build
    startCommand: node dist/src/index.js
    healthCheckPath: /readyz
    autoDeploy: false # a compliance tool should not redeploy itself on every push

    envVars:
      - key: NODE_VERSION
        value: "22.14.0"

      # Render routes to the container over its own network, so bind all
      # interfaces. TLS is terminated by Render in front of this.
      - key: BIND_HOST
        value: 0.0.0.0

      # No IdP in front here, so identity is earned with a password rather than
      # asserted in a header. Mint entries with tools/hash-password.mjs.
      - key: AUTH_MODE
        value: basic

      # No persistent disk on the free plan, so keep no trail rather than write
      # one that is discarded on every deploy and would fail verification.
      - key: AUDIT_MODE
        value: "off"

      # Prompted for at deploy time and never written into the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AUTH_USERS
        sync: false

# ---------------------------------------------------------------------------
# Durable configuration - for real customer data on Render
#
# Costs about $7/month for the instance plus $0.25/month for the disk. Replace
# the three marked lines above with:
#
#     plan: starter          # the free plan has no persistent disk
#     numInstances: 1        # the audit chain has exactly one writer
#
# add the disk:
#
#     disk:
#       name: audit
#       mountPath: /var/data
#       sizeGB: 1            # ~1 million records; grow it before it fills
#
# and change the audit env vars to:
#
#     - key: AUDIT_MODE
#       value: file
#     - key: AUDIT_DIR
#       value: /var/data/audit
#
# Note that this still puts the audit trail on a hosting provider's disk in
# Germany, which changes the answers to questions 1 and 4 in docs/HANDOVER.md
# Part B. The bank's own VM is the deployment those questions were written for.
# ---------------------------------------------------------------------------
