# Reverse proxy for the AML compliance assistant.
#
# This terminates TLS and authentication. The Node process binds 127.0.0.1 and
# trusts the user identity this proxy injects, so the proxy must be the ONLY
# path to it - verify with `ss -lptn` that nothing else is listening publicly.

upstream aml_atb {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aml.internal.example.az;

    ssl_certificate     /etc/ssl/certs/aml-atb.crt;
    ssl_certificate_key /etc/ssl/private/aml-atb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Customer data is pasted into this tool; do not let a proxy cache it.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # --- authentication -------------------------------------------------
    # Replace with your IdP integration. Options, in rough order of preference:
    #   1. auth_request against an OIDC/SAML sidecar (e.g. oauth2-proxy)
    #   2. mTLS client certificates issued by the bank's internal CA
    #   3. HTTP Basic against LDAP as an interim measure
    #
    # Whichever you choose, it MUST set the username header below, and MUST
    # strip any client-supplied value first - otherwise a user can assert an
    # identity of their choosing and the audit trail is worthless.
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_user;

    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
    }

    location / {
        proxy_pass http://aml_atb;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Identity, and the shared secret proving this request came via nginx.
        proxy_set_header X-Forwarded-User  $auth_user;
        proxy_set_header X-Auth-Secret     "REPLACE_WITH_AUTH_SHARED_SECRET";

        # SSE: responses stream token by token and must not be buffered.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Liveness probe, no authentication.
    location = /healthz {
        auth_request off;
        proxy_pass http://aml_atb;
    }
}

server {
    listen 80;
    server_name aml.internal.example.az;
    return 301 https://$host$request_uri;
}
