# Reverse proxy for the AML compliance assistant.
#
# This is a SITE config: install it at /etc/nginx/conf.d/aml-atb.conf (or
# sites-available + a symlink). It contains server blocks, so it must sit inside
# nginx's http{} context - dropping it in as /etc/nginx/nginx.conf fails with
# "upstream directive is not allowed here".
#
# Validate before reloading:   sudo nginx -t
#
# This proxy terminates TLS and authentication. The Node process binds
# 127.0.0.1 and trusts the identity injected here, so this must be the ONLY
# route to it - confirm with `ss -lptn 'sport = :3000'` that nothing else is
# listening publicly.

upstream aml_atb {
    server 127.0.0.1:3000;
    keepalive 8;
}

# Rate limit at the edge as well as in the app: the app's limiter is per
# authenticated user, this one catches floods before they reach it.
limit_req_zone $binary_remote_addr zone=aml_chat:10m rate=30r/m;

server {
    # `listen ... http2` works on nginx 1.9.5 through 1.24 (Ubuntu 24.04 ships
    # 1.24). On nginx >= 1.25.1 it warns as deprecated - there, replace with:
    #     listen 443 ssl;
    #     http2 on;
    listen 443 ssl http2;
    server_name aml.internal.example.az;

    ssl_certificate     /etc/ssl/certs/aml-atb.crt;
    ssl_certificate_key /etc/ssl/private/aml-atb.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Customer data is pasted into this tool; no proxy may cache it.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    client_max_body_size 1m;

    # ---------------------------------------------------------------------
    # Authentication
    # ---------------------------------------------------------------------
    # Replace the /_auth backend with your IdP integration. Options, roughly in
    # order of preference:
    #   1. oauth2-proxy in front of the bank's OIDC/SAML IdP (deploy/oauth2-proxy.cfg)
    #   2. mTLS client certificates from the internal CA (see the commented block below)
    #   3. HTTP Basic against LDAP, as an interim measure only
    #
    # Whatever you choose MUST set $auth_user from a VERIFIED identity. Note the
    # two proxy_set_header lines below that blank the client-supplied values:
    # without them a user can send their own X-Forwarded-User and the audit
    # trail records whoever they claim to be.
    auth_request /_auth;
    auth_request_set $auth_user $upstream_http_x_auth_request_user;

    location = /_auth {
        internal;
        proxy_pass              http://127.0.0.1:4180/oauth2/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        X-Original-URI $request_uri;
    }

    # Sign-in redirect and callback for oauth2-proxy.
    location /oauth2/ {
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 401 = @signin;
    location @signin {
        return 302 https://$host/oauth2/start?rd=$request_uri;
    }

    # --- mTLS alternative -------------------------------------------------
    # Delete the auth_request lines above and use instead:
    #     ssl_client_certificate /etc/ssl/certs/internal-ca.crt;
    #     ssl_verify_client on;
    #     ssl_verify_depth 2;
    # then map the certificate subject to a username:
    #     auth_request off;
    #     set $auth_user $ssl_client_s_dn_cn;

    location / {
        limit_req zone=aml_chat burst=10 nodelay;

        proxy_pass http://aml_atb;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Identity, and the shared secret proving this request came via nginx.
        # Both are set unconditionally, which also overwrites anything the
        # client sent under the same names.
        proxy_set_header X-Forwarded-User  $auth_user;
        proxy_set_header X-Auth-Secret     "REPLACE_WITH_AUTH_SHARED_SECRET";

        # SSE: answers stream token by token and must not be buffered.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Operational probes, unauthenticated so a load balancer and the monitoring
    # system can reach them. /healthz reports only that the process is up;
    # /readyz adds whether the audit trail is writable and the clause count.
    # Neither exposes customer data or conversation content.
    location = /healthz {
        auth_request off;
        access_log off;
        proxy_pass http://aml_atb;
    }

    location = /readyz {
        auth_request off;
        access_log off;
        proxy_pass http://aml_atb;
    }
}

server {
    listen 80;
    server_name aml.internal.example.az;
    return 301 https://$host$request_uri;
}
