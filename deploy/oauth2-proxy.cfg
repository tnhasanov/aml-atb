# oauth2-proxy — the identity half of the deployment.
#
# nginx calls this on every request (auth_request /_auth). It validates the
# session and returns the verified username in X-Auth-Request-User, which nginx
# forwards to the app as X-Forwarded-User. The app writes that name into every
# audit record, so this file is what makes the trail attributable.
#
# Install:
#   sudo cp deploy/oauth2-proxy.cfg /etc/oauth2-proxy.cfg
#   sudo chmod 600 /etc/oauth2-proxy.cfg     # contains the client secret
#   sudo systemctl enable --now oauth2-proxy
#
# Bind loopback only: like the app, this must be reachable through nginx alone.
http_address = "127.0.0.1:4180"
reverse_proxy = true

# --- provider ---------------------------------------------------------------
# Replace with the institution's IdP. Keycloak, Entra ID, Okta and generic
# OIDC all work; `oidc` with an issuer URL is the portable choice.
provider = "oidc"
oidc_issuer_url = "https://sso.internal.example.az/realms/bank"
client_id = "aml-atb"
client_secret = "REPLACE_ME"

# openssl rand -base64 32
cookie_secret = "REPLACE_ME"
cookie_name = "_oauth2_proxy"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
# Re-authenticate daily; an AML tool should not hold a week-long session.
cookie_expire = "8h"
cookie_refresh = "1h"

# --- who may sign in --------------------------------------------------------
# Restrict to the compliance function. Everyone who can sign in can read the
# assistant's answers about customers, so this list is an access control on
# customer data, not just a convenience.
email_domains = ["example.az"]
# Preferred: gate on an IdP group instead of a domain.
# allowed_groups = ["aml-compliance", "internal-audit"]

# --- what nginx receives ----------------------------------------------------
# The app expects a stable, non-email username. `preferred_username` keeps audit
# records short and readable; switch to "email" if that is the canonical id.
set_xauthrequest = true
oidc_email_claim = "email"
user_id_claim = "preferred_username"

skip_provider_button = true
# The app's own liveness probe must not require a session.
skip_auth_routes = ["GET=/healthz", "GET=/readyz"]
